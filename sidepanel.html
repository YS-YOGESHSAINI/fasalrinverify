<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FasalRin loan application verify</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      background-color: #f4f4f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 85vh;
      margin: 0;
    }
    .container {
      flex: 1;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 15px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
    }
    input[type="number"] {
      width: 60px;
      padding: 5px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      margin-right: 5px;
    }
    #startBtn { background-color: #28a745; }
    #stopBtn { background-color: #dc3545; }
    button:hover { opacity: 0.9; }
    .status-box {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-top: 15px;
    }
    .status-box p {
      margin: 8px 0;
      font-size: 14px;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: auto;
      padding-top: 20px;
    }
    .heart {
      color: #ff4d4d;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>FasalRin application verify</h2>
    
    <div class="control-group">
      <label for="loopInput">Loop Count:</label>
      <input type="number" id="loopInput" value="10" min="1" max="100">
    </div>

    <div class="control-group">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
    </div>

    <div class="status-box">
      <p><strong>Status:</strong> <span id="statusText" style="color: #666;">Stopped</span></p>
      <p><strong>Progress:</strong> <span id="loopCount">0 / 10</span></p>
    </div>
  </div>

  <div class="footer">
    Made with <span class="heart">&hearts;</span> by YOGESH SAINI
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
